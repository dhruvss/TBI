name: tbi-tracer

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Core scientific Python
  - numpy
  - pandas
  - scipy
  - matplotlib

  # Cheminformatics and molecular preparation
  - rdkit
  - openbabel
  - pdbfixer
  - openmm
  - gemmi

  # Docking
  - vina

  # R and analysis packages
  - r-base
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-stringr
  - r-ggplot2
  - r-ggrepel

  # Pip packages
  - pip:
      - meeko
